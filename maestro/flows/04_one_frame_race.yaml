# Scenario 3: the original one-frame race, with no shell gating involved.
#
# go() updates currentConfiguration synchronously; the shell's Navigator only
# mounts on the next frame. That window is ~16ms, too short to hit with a real
# key press, so the app itself pushes the same popRoute message the engine
# sends. Only the timing is scripted; the ordering is the framework's own.
appId: dev.broto.go_router_poproute_repro
name: One frame race between push() and the shell Navigator
tags:
  - crash
---
- launchApp:
    clearState: true
- tapOn: "Synthetic one-frame race"

# Same ending as a real back press: handlePopRoute swallowed the TypeError and
# called SystemNavigator.pop().
- assertNotVisible: "Synthetic one-frame race"

- launchApp
- extendedWaitUntil:
    visible: "PREVIOUS RUN CRASHED"
    timeout: 20000
- assertVisible: "Null check operator used on a null value"
- assertVisible: "GoRouterDelegate._findCurrentNavigators"
